name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: 门（布局 / 脱敏 / 变异）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 判据落仓库内文件，不读 git 元数据 → 默认浅克隆就够（不用 fetch-depth: 0）
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 布局门（方法论装订）
        run: node tools/check-sprint-layout.mjs
      - name: 脱敏门
        run: node tools/check-desensitized.mjs
      - name: 变异验证（两道门都要能跑红）
        run: node tools/mutate-gates.mjs

  test:
    name: 测试（node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 本机只有 v24；跨版本行为只能靠这条矩阵证明（HANDOFF-M0 §5 U2）
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零第三方依赖：不跑 npm install。测试用 node:test，无需任何包。
      - name: 零依赖断言（dependencies / devDependencies 必须为空）
        shell: bash
        run: |
          node -e "
          const p = require('./package.json');
          const d = Object.keys(p.dependencies ?? {});
          const v = Object.keys(p.devDependencies ?? {});
          console.log('dependencies', d.length, 'devDependencies', v.length);
          if (d.length || v.length) { console.error('FAIL 本项目承诺零第三方依赖'); process.exit(1); }
          "
      - name: 单元 / 契约测试
        # 逐文件列出（不用目录或 glob 形式：node --test <目录> 在不同版本行为不同）
        run: >
          node --test
          tests/architecture.test.mjs
          tests/paths.test.mjs
          tests/resolve.test.mjs
          tests/scan.test.mjs
          tests/cli.test.mjs
      - name: CLI 冒烟（退出码 0 / 4 / 3）
        shell: bash
        run: |
          set -e
          node bin/depcheck-live.mjs --version
          node bin/depcheck-live.mjs check . --json > /dev/null && echo "exit 0 on self" || echo "exit $?"
          node bin/depcheck-live.mjs --version || true