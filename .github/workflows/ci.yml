name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的新 push 取消仍在跑的旧 run，省排队时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: 门（布局 / 脱敏 / 发布 / 变异）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 判据落仓库内文件，不读 git 元数据 → 默认浅克隆就够（不用 fetch-depth: 0）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 布局门（方法论装订）
        run: node tools/check-sprint-layout.mjs
      - name: 脱敏门
        run: node tools/check-desensitized.mjs
      # 发布门只挂**离线档**：它只读仓库内文件，任意触发形态都成立。
      # `--pre-tag` 的判据之一是"这个 tag 还不存在"——tag 推送那一轮它必红；
      # `--online` 需要网络 + gh 登录 + 已首推。两档都只能人手跑（见 plan/RELEASE-M6.md §四）。
      - name: 发布门（离线档）
        run: node tools/check-release.mjs
      - name: 变异验证（两道门都要能跑红）
        run: node tools/mutate-gates.mjs

  test:
    name: 测试（node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 本机只有 v24；跨版本行为只能靠这条矩阵证明（HANDOFF-M0 §5 U2）
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # 零第三方依赖：不跑 npm install。测试用 node:test，无需任何包。
      - name: 零依赖断言（dependencies / devDependencies 必须为空）
        shell: bash
        run: |
          node -e "
          const p = require('./package.json');
          const d = Object.keys(p.dependencies ?? {});
          const v = Object.keys(p.devDependencies ?? {});
          console.log('dependencies', d.length, 'devDependencies', v.length);
          if (d.length || v.length) { console.error('FAIL 本项目承诺零第三方依赖'); process.exit(1); }
          "
      - name: 单元 / 契约测试
        # 逐文件列出（不用目录或 glob 形式：node --test <目录> 在不同版本行为不同）
        run: >
          node --test
          tests/architecture.test.mjs
          tests/gate-selfcheck.test.mjs
          tests/handoff-pointer.test.mjs
          tests/paths.test.mjs
          tests/resolve.test.mjs
          tests/scan.test.mjs
          tests/scan-edge.test.mjs
          tests/scan-large-file.test.mjs
          tests/fingerprints.test.mjs
          tests/thresholds.test.mjs
          tests/fixtures.test.mjs
          tests/fixtures-layout.test.mjs
          tests/fixtures-run.test.mjs
          tests/cli.test.mjs
          tests/drift.test.mjs
          tests/baselines.test.mjs
          tests/contract.test.mjs
          tests/bench.test.mjs
          tests/selftest.test.mjs
          tests/release.test.mjs
      - name: CLI 冒烟（退出码 0 / 4 / 3）
        shell: bash
        run: |
          set -e
          node bin/depcheck-live.mjs --version
          node bin/depcheck-live.mjs check . --json > /dev/null && echo "exit 0 on self" || echo "exit $?"
          node bin/depcheck-live.mjs --version || true